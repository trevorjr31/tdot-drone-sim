# Drone simulation services. The React app still runs on the host (`npm run dev` in frontend/).
#
#   docker compose up -d          # start PX4 + bridge
#   docker compose logs -f        # watch their output
#   docker compose down           # stop everything

services:
  px4:
    build:
      context: ./sim/px4
      args:
        PX4_VERSION: v1.16.2
    image: tdot/px4-sitl:v1.16.2
    container_name: tdot-px4
    environment:
      PX4_SIM_MODEL: sihsim_quadx
      # Home: Nathan Phillips Square (City Hall), Toronto. Altitude is metres above sea level.
      PX4_HOME_LAT: "43.65255"
      PX4_HOME_LON: "-79.38330"
      PX4_HOME_ALT: "92"
    # PX4 only sends MAVLink to localhost, so it shares the bridge's network. The bridge owns
    # it (not the other way round) so PX4 can restart (Reset after a crash) without taking
    # the bridge's network down with it.
    network_mode: "service:bridge"
    depends_on:
      - bridge
    # PX4's interactive console needs a TTY to stay up when detached.
    stdin_open: true
    tty: true
    # Also how Reset works: the bridge asks PX4 to reboot, PX4 exits, Docker starts it again at home.
    restart: unless-stopped

  bridge:
    build:
      context: ./sim/bridge
    image: tdot/px4-bridge:dev
    container_name: tdot-bridge
    # WebSocket for the app, bound to localhost only.
    ports:
      - "127.0.0.1:8765:8765"
    # City of Toronto boundary for PX4's geofence, from `npm run data` (read-only).
    volumes:
      - ./frontend/public/data/toronto:/data:ro
      # Sim config set from the app's Settings (speeds, battery, ceiling…), kept over restarts.
      - bridge-config:/config
    environment:
      MAVLINK_URL: udpin://0.0.0.0:14540
      FENCE_FILE: /data/boundary-fence.geojson
      FENCE_CEILING_M: "120"
      # Defaults for the sim config until it's changed in the app's Settings (then the saved
      # value in the bridge-config volume wins): geofence ceiling, and minutes of hovering on
      # a full battery (more or less with load).
      BATTERY_FLIGHT_MIN: "${BATTERY_FLIGHT_MIN:-20}"
      CONFIG_FILE: /config/sim-config.json
      WS_PORT: "8765"
      STATE_RATE_HZ: "20"
    restart: unless-stopped

volumes:
  bridge-config:
