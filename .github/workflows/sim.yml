name: Flight sim

# Builds PX4 SITL and the bridge, then flies twice: directly over MAVLink, and
# through the bridge's WebSocket the way the browser does. Runs when the sim
# changes, or on demand.
on:
  push:
    branches: [main]
    paths: ['sim/**', 'docker-compose.yml', '.github/workflows/sim.yml']
  pull_request:
    paths: ['sim/**', 'docker-compose.yml', '.github/workflows/sim.yml']
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flight-test:
    name: PX4 SITL + bridge flight tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The PX4 build stage is ~6 GB; runners start with ~14 GB free. Remove big preinstalled
      # toolchains we don't use so the build (and its cache export) can't run out of disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af > /dev/null || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      # First run compiles PX4 (~15-20 min on a GitHub runner); later runs reuse the cache.
      # The image itself is small (~200 MB: just the compiled simulator); the cache holds the
      # build stage too, and a failed cache export must not fail the job.
      - name: Build PX4 image
        uses: docker/build-push-action@v7
        with:
          context: sim/px4
          build-args: PX4_VERSION=v1.16.2
          tags: tdot/px4-sitl:v1.16.2
          load: true
          cache-from: type=gha,scope=px4-sitl
          cache-to: type=gha,scope=px4-sitl,mode=max,ignore-error=true

      - name: Build bridge image
        uses: docker/build-push-action@v7
        with:
          context: sim/bridge
          tags: tdot/px4-bridge:dev
          load: true
          cache-from: type=gha,scope=px4-bridge
          cache-to: type=gha,scope=px4-bridge,mode=max,ignore-error=true

      # The bridge uploads the City of Toronto boundary to PX4 as a geofence; generate just that file.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare geofence data
        working-directory: frontend
        run: |
          npm ci
          npm run data -- --only=boundary-fence

      - name: Start PX4 and bridge
        run: docker compose up -d --no-build

      - name: Wait until PX4 is ready for takeoff
        run: |
          for i in $(seq 1 60); do
            if docker compose logs px4 | grep -q "Ready for takeoff"; then
              echo "PX4 ready after ~$((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "PX4 did not become ready in 120 s"; exit 1

      - name: Install test tools
        run: |
          docker build -t tdot/sim-tools -f - sim/tools <<'EOF'
          FROM python:3.12-slim
          COPY requirements.txt .
          RUN pip install --no-cache-dir --root-user-action=ignore -r requirements.txt
          EOF

      - name: Flight test (direct MAVLink)
        run: docker run --rm --network container:tdot-px4 -v "$PWD/sim/tools:/tools:ro" tdot/sim-tools python -u /tools/flight_test.py

      - name: Flight test (through the bridge's WebSocket)
        run: docker run --rm --network container:tdot-px4 -v "$PWD/sim/tools:/tools:ro" tdot/sim-tools python -u /tools/bridge_test.py

      - name: Logs (on failure)
        if: failure()
        run: |
          df -h /
          docker compose logs --no-color | tail -300

      - name: Stop PX4
        if: always()
        run: docker compose down
